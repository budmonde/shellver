[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shellver"
version = "0.4.0"
description = "Detect stale interactive shell configuration generations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "mduinkharjav" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/budmonde/shellver"

[project.scripts]
shellver = "shellver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shellver"]
